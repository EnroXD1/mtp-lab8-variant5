name: Python and Docker checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install poetry==2.2.1
      - run: poetry check --lock --strict
      - run: poetry install --no-interaction
      - run: poetry run flake8 src tests
      - run: poetry run pytest -q
      - name: Build Docker image
        run: docker build -t mtp-lab8:check .
      - name: Run CLI inside Docker without network
        run: |
          docker run --rm --network none mtp-lab8:check --help
          docker run --rm --network none mtp-lab8:check --version
          code=0
          docker run --rm --network none mtp-lab8:check " " || code=$?
          test "$code" -eq 2
